# Blueprint do Render para o n8n do Nima (serviço separado do backend)
# New > Blueprint > conecte este repositório. O n8n roda a partir da imagem oficial.
services:
  - type: web
    name: nima-n8n
    runtime: image
    image:
      url: docker.n8n.io/n8nio/n8n:latest
    plan: starter          # o free tier do Render NÃO suporta disco; n8n precisa de disco p/ persistir
    region: oregon
    healthCheckPath: /healthz
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n   # sem isso o n8n perde workflows/credenciais a cada deploy
      sizeGB: 1
    envVars:
      # ---- SERVIDOR E REDE ----
      - key: PORT
        value: 5678               # Porta padrão do n8n
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PATH
        value: /                   # Define explicitamente a rota da interface web
      - key: N8N_PROXY_HOPS
        value: "1"                 # n8n roda atrás do proxy do Render; confia no X-Forwarded-Proto
      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: N8N_ENCRYPTION_KEY
        generateValue: true        # O Render gera e fixa a chave de criptografia
      - key: N8N_HOST
        sync: false                # Definir no painel (ex.: nima-n8n.onrender.com)
      - key: WEBHOOK_URL           # << variável CORRETA do n8n (antes estava N8N_WEBHOOK_URL, que o n8n ignora)
        sync: false                # Definir no painel (ex.: https://nima-n8n.onrender.com/)

      # ---- BANCO DO N8N ----
      # O n8n usa SQLite no DISCO montado (mountPath /home/node/.n8n, acima).
      # NÃO usar o Postgres do Supabase do app: isso despejava as ~115 tabelas
      # internas do n8n dentro do banco do Nima. O SQLite no disco persiste
      # workflows/credenciais entre deploys e mantém os bancos separados.

      # ---- CORREÇÕES DE DEPRECIAÇÃO DO N8N ----
      - key: N8N_UNVERIFIED_PACKAGES_ENABLED
        value: "true"
      - key: N8N_RUNNERS_TASK_TIMEOUT
        value: "300"
      - key: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
        value: "2147483648"
      - key: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
        value: "5000"