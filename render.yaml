# Blueprint do Render para o n8n do Nima (serviço separado do backend)
# New > Blueprint > conecte este repositório. O n8n roda a partir da imagem oficial.
services:
  - type: web
    name: nima-n8n
    runtime: image
    image:
      url: docker.n8n.io/n8nio/n8n:latest
    plan: starter          # o free tier do Render NÃO suporta disco; n8n precisa de disco p/ persistir
    region: oregon
    healthCheckPath: /healthz
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n   # sem isso o n8n perde workflows/credenciais a cada deploy
      sizeGB: 1
    envVars:
      # ---- SERVIDOR E REDE ----
      - key: PORT
        value: 10000               # Porta padrão exposta pelo Render
      - key: N8N_PORT
        value: 10000
      - key: N8N_PROTOCOL
        value: https
      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: N8N_ENCRYPTION_KEY
        generateValue: true        # O Render gera e fixa a chave de criptografia
      - key: N8N_HOST
        sync: false                # Definir no painel (ex.: nima-n8n.onrender.com)
      - key: WEBHOOK_URL
        sync: false                # Definir no painel (ex.: https://nima-n8n.onrender.com/)
        
      # ---- CONFIGURAÇÃO DO BANCO POSTGRES (SUPABASE) ----
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        value: postgres            
      - key: DB_POSTGRESDB_PORT
        value: 5432                
      - key: DB_POSTGRESDB_HOST
        sync: false                # Host do Supabase (ex.: aws-1-us-east-2.pooler.supabase.com)
      - key: DB_POSTGRESDB_USER
        sync: false                # Usuário (ex.: postgres.zhlvrbaupzhjzsyzpbyz)
      - key: DB_POSTGRESDB_PASSWORD
        sync: false                # Sua senha do banco Supabase
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"             # Obrigatório para conexões SSL/Pooler no Supabase

      # ---- CORREÇÕES DE DEPRECIAÇÃO DO N8N ----
      - key: N8N_UNVERIFIED_PACKAGES_ENABLED
        value: "true"
      - key: N8N_RUNNERS_TASK_TIMEOUT
        value: "300"
      - key: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
        value: "2147483648"
      - key: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
        value: "5000"